# The Wyrd settings catalogue.
#
# Wyrd is setting-agnostic. Each setting lives in its own repository and is overlaid onto a
# chronicle at bootstrap (design/16-chronicle-bootstrap.md).
#
# `note:` records only a KNOWN ENGINE GAP — something a setting will need that the core does
# not yet provide. It is not for recording where an engine rule came from.
#
# A setting derived from copyrighted material is PRIVATE and its repository will not be
# reachable by anyone but its owner. Such entries are listed so the catalogue is complete,
# not because they can be obtained. A setting built from original material may be public.

settings:
